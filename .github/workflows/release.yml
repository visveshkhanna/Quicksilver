name: Release

# Push a tag like v0.1.0 after `pnpm version:set 0.1.0` and a CHANGELOG entry.
# The release is created as a draft, every platform builds into it, and it is
# published only when all of them succeed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Check and draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Version, tag and changelog agree
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs notes "$GITHUB_REF_NAME" > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "Quicksilver ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: ""
            targets: ""
          - name: Windows x64
            os: windows-latest
            args: ""
            targets: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ubuntu 22.04 rather than latest: the .deb and AppImage link against
      # its glibc, so they also run on older distributions.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: cargo test --workspace --locked
      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/rpm/*.rpm
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/msi/*.msi
            target/**/bundle/nsis/*.exe

  publish:
    name: Publish
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
