name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm version:check
      - run: cargo fmt --all --check

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-latest }
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # `cargo test` regenerates the UI's TypeScript types; they must match
      # what is committed.
      - name: Check generated TypeScript types
        shell: bash
        run: |
          git add -N apps/desktop/src/ipc/generated
          git diff --exit-code -- apps/desktop/src/ipc/generated
      # Builds the frontend and the release binary, without installers, so a
      # change that only breaks the packaged app still fails here.
      - name: Build the app
        run: pnpm tauri build --no-bundle

  live:
    name: Live database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the development databases
        run: |
          docker compose -f dev/compose.yaml up -d --wait postgres mysql mariadb mssql clickhouse mongodb redis
          docker compose -f dev/compose.yaml run --rm mssql-seed
      - name: Install Linux packages
        run: scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Live tests are #[ignore]d so `cargo test` needs no database; this job
      # runs only those, against the containers above.
      # The keychain test needs a desktop session; CI runners have none.
      - run: cargo test --workspace --locked -- --ignored --skip the_os_keychain_round_trips
      - name: Database logs
        if: failure()
        run: docker compose -f dev/compose.yaml logs
