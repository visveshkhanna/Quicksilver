[package]
name = "qs-net"
description = "TLS, SSH and AWS SSM tunnels, and password-command auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
qs-core.workspace = true
# `ring` rather than the default aws-lc-rs provider: pure Rust plus assembly,
# no C toolchain or CMake needed on any OS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

[lints]
workspace = true
