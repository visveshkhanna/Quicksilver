[package]
name = "qs-drivers"
description = "One driver per database engine, behind cargo features"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["postgres", "sqlite"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:futures-util", "dep:serde_json"]
sqlite = ["dep:rusqlite"]

[dependencies]
ts-rs.workspace = true
qs-core.workspace = true
qs-net.workspace = true
qs-sql.workspace = true
tokio = { workspace = true }
tokio-util = "0.7"
tracing.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }

futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7.18", optional = true, features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
# `bundled` compiles SQLite into the binary so every OS gets the same version.
# `column_metadata` names the table and column a result column comes from,
# which phase 6 needs to decide whether a cell can be edited.
rusqlite = { workspace = true, optional = true, features = ["column_decltype", "column_metadata"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
